# Reusable: frontend quality gate (lint, type-check, production build).
# There is no unit-test runner in the frontend, so the "tests" here are the
# strict ESLint pass, the TypeScript type-check, and a full production build.
name: Frontend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, zero warnings)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
