# Main branch: re-run the full quality gate on every push to main, then build
# and publish the container images to GHCR tagged with the git SHA and `latest`.
name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/reusable-backend.yml

  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml

  dependencies:
    uses: ./.github/workflows/reusable-dependencies.yml

  terraform:
    uses: ./.github/workflows/reusable-terraform.yml

  # Publish only after the blocking quality gates pass.
  docker-publish:
    needs: [backend, frontend, security]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      push: true
