# Reusable: dependency vulnerability scanning for Python and Node.
#
# These run as advisory (continue-on-error): they always report known advisories
# in the dependency tree into the job summary/logs, but do not block merges on
# upstream CVEs the project cannot immediately fix. Teams triage from the report.
name: Dependency scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install . pip-audit==2.7.3

      - name: Audit (advisory)
        continue-on-error: true
        run: pip-audit --desc --progress-spinner=off

  node:
    name: Node dependencies (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
