# Reusable: security scanning with Trivy.
#
# Strategy:
#   * A full filesystem scan (vulnerabilities, IaC misconfiguration, secrets) is
#     published to GitHub code scanning as SARIF so findings are triaged in the
#     Security tab. This step is non-blocking: gating merges on third-party CVEs
#     that are outside this repo's control would keep the pipeline permanently
#     red without improving the code.
#   * A dedicated secret scan IS a hard gate (exit-code 1) - committing a secret
#     is always in the project's control and must never merge.
name: Security scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Fail on committed secrets
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"
