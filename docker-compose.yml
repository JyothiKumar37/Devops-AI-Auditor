# =============================================================================
# DevOps AI Auditor - development stack
# -----------------------------------------------------------------------------
# Credentials come from the .env file (copy from .env.example). No secrets are
# hardcoded here. Service hostnames (postgres, redis, backend) are provided via
# the compose network so containers reach each other by name.
# =============================================================================

# A fixed project name so volume/container names stay stable regardless of the
# directory this file is run from (a renamed/re-cloned folder would otherwise
# create a brand-new, empty set of volumes and look like "lost data").
name: devops-ai-auditor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Host bind mount: the database lives in ./data/postgres on the host, so it
      # survives `docker compose down` (and even `down -v`), rebuilds and renames.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d ${POSTGRES_DB:-auditor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Run scans on the Celery worker. The workspace root is a shared volume so
      # the worker can read the upload the API saved.
      SCAN_ASYNC: ${SCAN_ASYNC:-true}
      WORKSPACE_ROOT: /workspaces
      # AI reasoning + AI review scan (see .env).
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AI_SCAN_ENABLED: ${AI_SCAN_ENABLED:-false}
      # LLM reasoning inside /report. Off by default so the report/Overview
      # render instantly and deterministically (AI value is on-demand elsewhere).
      AI_REPORT_ENABLED: ${AI_REPORT_ENABLED:-false}
      # Phase 2: SCM integrations, PR scanning, webhooks, notifications.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-1000000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-devops-auditor@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATIONS_ALLOW_PRIVATE_HOSTS: ${NOTIFICATIONS_ALLOW_PRIVATE_HOSTS:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Same shared workspace volume as the backend, so the worker reads the
      # upload the API persisted for the scan it processes.
      WORKSPACE_ROOT: /workspaces
      # The AI review scan runs here in async mode, so the worker needs the LLM config.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AI_SCAN_ENABLED: ${AI_SCAN_ENABLED:-false}
      AI_REPORT_ENABLED: ${AI_REPORT_ENABLED:-false}
      # Phase 2: the worker runs PR scans, so it needs the encryption key (to
      # decrypt stored tokens), the SCM API URLs, and the notification config.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-devops-auditor@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATIONS_ALLOW_PRIVATE_HOSTS: ${NOTIFICATIONS_ALLOW_PRIVATE_HOSTS:-false}
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      # The dev server (running inside this container) proxies /api to the
      # backend service; the browser only ever talks to the frontend origin.
      VITE_API_BASE_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

# Postgres/Redis data are persisted via host bind mounts under ./data. The scan
# workspace is a named volume (shared by backend + worker) so it inherits the
# image's app-user ownership and stays writable by the non-root process; its
# contents are ephemeral (each scan cleans up after itself).
volumes:
  workspaces:
