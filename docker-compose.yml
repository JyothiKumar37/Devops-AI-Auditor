# =============================================================================
# DevOps AI Auditor - development stack
# -----------------------------------------------------------------------------
# Credentials come from the .env file (copy from .env.example). No secrets are
# hardcoded here. Service hostnames (postgres, redis, backend) are provided via
# the compose network so containers reach each other by name.
# =============================================================================

# A fixed project name so volume/container names stay stable regardless of the
# directory this file is run from (a renamed/re-cloned folder would otherwise
# create a brand-new, empty set of volumes and look like "lost data").
name: devops-ai-auditor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
    # Bind to loopback only: containers reach Postgres over the compose network by
    # service name; the host mapping must NOT be exposed on a public interface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Host bind mount: the database lives in ./data/postgres on the host, so it
      # survives `docker compose down` (and even `down -v`), rebuilds and renames.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d ${POSTGRES_DB:-auditor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only - Redis has no auth by default and must never be reachable
    # from a public interface. Containers reach it via the compose network.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Run scans on the Celery worker. The workspace root is a shared volume so
      # the worker can read the upload the API saved.
      SCAN_ASYNC: ${SCAN_ASYNC:-true}
      WORKSPACE_ROOT: /workspaces
      # AI reasoning + AI review scan (see .env).
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AI_SCAN_ENABLED: ${AI_SCAN_ENABLED:-false}
      # LLM reasoning inside /report. Off by default so the report/Overview
      # render instantly and deterministically (AI value is on-demand elsewhere).
      AI_REPORT_ENABLED: ${AI_REPORT_ENABLED:-false}
      # Phase 3: agentic AI investigation / reviews (optional, non-authoritative).
      AI_PR_REVIEW_ENABLED: ${AI_PR_REVIEW_ENABLED:-false}
      AI_REVIEW_MAX_ITEMS: ${AI_REVIEW_MAX_ITEMS:-8}
      # Phase 2: SCM integrations, PR scanning, webhooks, notifications.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-1000000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-devops-auditor@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATIONS_ALLOW_PRIVATE_HOSTS: ${NOTIFICATIONS_ALLOW_PRIVATE_HOSTS:-false}
      # Phase 4: cloud (AWS) runtime intelligence - read-only, STS AssumeRole.
      AWS_STS_REGION: ${AWS_STS_REGION:-us-east-1}
      AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-devops-ai-auditor}
      AWS_ASSUME_ROLE_DURATION: ${AWS_ASSUME_ROLE_DURATION:-3600}
      AWS_DEFAULT_REGIONS: ${AWS_DEFAULT_REGIONS:-us-east-1}
      AWS_MAX_CONCURRENCY: ${AWS_MAX_CONCURRENCY:-4}
      AWS_SYNC_INTERVAL_HOURS: ${AWS_SYNC_INTERVAL_HOURS:-6}
      CLOUD_WRITE_ENABLED: ${CLOUD_WRITE_ENABLED:-false}
      # The platform's OWN base identity used to call sts:AssumeRole. In AWS this
      # comes from the task role / instance profile; locally, pass these through.
      # No per-account keys are ever stored - only short-lived assumed creds.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Phase 5: continuous security operations & incident response.
      SECURITY_OPS_ENABLED: ${SECURITY_OPS_ENABLED:-true}
      INCIDENT_AUTO_CREATE: ${INCIDENT_AUTO_CREATE:-true}
      INCIDENT_CORRELATION_WINDOW_MINUTES: ${INCIDENT_CORRELATION_WINDOW_MINUTES:-1440}
      SECURITY_POLL_INTERVAL_MINUTES: ${SECURITY_POLL_INTERVAL_MINUTES:-15}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-90}
      SECURITY_WEBHOOK_MAX_BODY_BYTES: ${SECURITY_WEBHOOK_MAX_BODY_BYTES:-1000000}
      SECURITY_WEBHOOK_REPLAY_WINDOW_SECONDS: ${SECURITY_WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # -B runs the embedded beat scheduler alongside the worker so Phase 4's
    # periodic cloud synchronization (gated by AWS_SYNC_INTERVAL_HOURS) fires.
    command: ["celery", "-A", "workers.celery_app.celery_app", "worker", "--beat", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Same shared workspace volume as the backend, so the worker reads the
      # upload the API persisted for the scan it processes.
      WORKSPACE_ROOT: /workspaces
      # The AI review scan runs here in async mode, so the worker needs the LLM config.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AI_SCAN_ENABLED: ${AI_SCAN_ENABLED:-false}
      AI_REPORT_ENABLED: ${AI_REPORT_ENABLED:-false}
      AI_PR_REVIEW_ENABLED: ${AI_PR_REVIEW_ENABLED:-false}
      AI_REVIEW_MAX_ITEMS: ${AI_REVIEW_MAX_ITEMS:-8}
      # Phase 2: the worker runs PR scans, so it needs the encryption key (to
      # decrypt stored tokens), the SCM API URLs, and the notification config.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-devops-auditor@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATIONS_ALLOW_PRIVATE_HOSTS: ${NOTIFICATIONS_ALLOW_PRIVATE_HOSTS:-false}
      # Phase 4: the worker runs scheduled cloud syncs (Celery beat), so it needs
      # the same read-only AWS/STS configuration and base identity as the backend.
      AWS_STS_REGION: ${AWS_STS_REGION:-us-east-1}
      AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-devops-ai-auditor}
      AWS_ASSUME_ROLE_DURATION: ${AWS_ASSUME_ROLE_DURATION:-3600}
      AWS_DEFAULT_REGIONS: ${AWS_DEFAULT_REGIONS:-us-east-1}
      AWS_MAX_CONCURRENCY: ${AWS_MAX_CONCURRENCY:-4}
      AWS_SYNC_INTERVAL_HOURS: ${AWS_SYNC_INTERVAL_HOURS:-6}
      CLOUD_WRITE_ENABLED: ${CLOUD_WRITE_ENABLED:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Phase 5: the worker runs security ingestion + the scheduled poll/correlate/
      # prune sweep (Celery beat), so it needs the same security-ops configuration.
      SECURITY_OPS_ENABLED: ${SECURITY_OPS_ENABLED:-true}
      INCIDENT_AUTO_CREATE: ${INCIDENT_AUTO_CREATE:-true}
      INCIDENT_CORRELATION_WINDOW_MINUTES: ${INCIDENT_CORRELATION_WINDOW_MINUTES:-1440}
      SECURITY_POLL_INTERVAL_MINUTES: ${SECURITY_POLL_INTERVAL_MINUTES:-15}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-90}
      SECURITY_WEBHOOK_MAX_BODY_BYTES: ${SECURITY_WEBHOOK_MAX_BODY_BYTES:-1000000}
      SECURITY_WEBHOOK_REPLAY_WINDOW_SECONDS: ${SECURITY_WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      # The dev server (running inside this container) proxies /api to the
      # backend service; the browser only ever talks to the frontend origin.
      VITE_API_BASE_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

# Postgres/Redis data are persisted via host bind mounts under ./data. The scan
# workspace is a named volume (shared by backend + worker) so it inherits the
# image's app-user ownership and stays writable by the non-root process; its
# contents are ephemeral (each scan cleans up after itself).
volumes:
  workspaces:
